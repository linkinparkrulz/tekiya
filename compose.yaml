services:
  app:
    build: .
    environment:
      NYM_NETWORK: ${NYM_NETWORK:-testnet4}
      NYM_DATA: /data
      NYM_TOR_PROXY: socks5h://tor:9050
      NYM_LISTEN_HOST: 0.0.0.0
      NYM_PORT: "8088"
      NYM_PUBLIC_PAYMENTS: ${NYM_PUBLIC_PAYMENTS:-false}
      # Shared listener is reachable from private peers too: require auth.
      NYM_ADMIN_HOST: 0.0.0.0
      NYM_ADMIN_PORT: "8089"
      NYM_ADMIN_AUTH: password
      NYM_ADMIN_PASSWORD: ${NYM_ADMIN_PASSWORD:?Set NYM_ADMIN_PASSWORD to a unique password of at least 12 characters}
      NYM_ONION_HOSTNAME_FILE: /onion/hostname
      # Optional Monero (start with: docker compose --profile monero up -d)
      NYM_MONERO_RPC: http://monero-wallet:18083/json_rpc
      NYM_MONERO_RPC_LOGIN_FILE: /monero-secret/rpc-login
      NYM_MONERO_PROXY: tor:9050
    volumes:
      - app-data:/data
      - onion-name:/onion:ro
      - monero-secret:/monero-secret:ro
    networks:
      - private
      - dashboard
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tor:
    build:
      context: deploy
      dockerfile: Tor.Dockerfile
    volumes:
      - tor-data:/var/lib/tor
      - onion-name:/run/onion
    networks:
      - private
      - outbound
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  monero-wallet:
    profiles: ["monero"]
    build:
      context: deploy
      dockerfile: Monero.Dockerfile
    environment:
      NYM_NETWORK: ${NYM_NETWORK:-testnet4}
    volumes:
      - monero-wallet:/wallet
      - monero-secret:/monero-secret
    # Onion nodes are reached through the tor service. For a node on your
    # LAN, also add the "outbound" network here.
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard:
    build:
      context: deploy
      dockerfile: Forward.Dockerfile
    ports:
      # Host loopback only. From another machine, use an SSH tunnel.
      - "127.0.0.1:8089:8089"
    networks:
      - dashboard
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  private:
    internal: true
  outbound: {}
  dashboard:
    internal: true

volumes:
  app-data: {}
  tor-data: {}
  onion-name: {}
  monero-wallet: {}
  monero-secret: {}
