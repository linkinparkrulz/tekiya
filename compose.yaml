services:
  app:
    build: .
    environment:
      NYM_NETWORK: ${NYM_NETWORK:-testnet4}
      NYM_DATA: /data
      NYM_TOR_PROXY: socks5h://tor:9050
      NYM_LISTEN_HOST: 0.0.0.0
      NYM_PORT: "8088"
      NYM_ADMIN_AUTH: setup
      NYM_ADMIN_SOCKET: /run/tekiya-admin/admin.sock
      NYM_ONION_HOSTNAME_FILE: /onion/hostname
    volumes:
      - app-data:/data
      - admin-socket:/run/tekiya-admin
      - onion-name:/onion:ro
    networks:
      - private
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  tor:
    build:
      context: deploy
      dockerfile: Tor.Dockerfile
    volumes:
      - tor-data:/var/lib/tor
      - onion-name:/run/onion
    networks:
      - private
      - outbound
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  dashboard:
    build:
      context: deploy
      dockerfile: Forward.Dockerfile
    depends_on:
      - app
    volumes:
      - type: volume
        source: admin-socket
        target: /run/tekiya-admin
        read_only: true
        volume:
          nocopy: true
    ports:
      # Host loopback only. From another machine, use an SSH tunnel.
      - "127.0.0.1:8089:8089"
    networks:
      - dashboard-host
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

networks:
  private:
    internal: true
  outbound: {}
  dashboard-host: {}

volumes:
  app-data: {}
  admin-socket: {}
  tor-data: {}
  onion-name: {}
